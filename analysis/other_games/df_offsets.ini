# Delta Force External Cheat — Offset Configuration
# Update these offsets when the game patches.
# Values can be hex (0x...) or decimal.
#
# Use a dumper (e.g. Dumper-7, UnrealDumper) to find current offsets.

[Game]
# Process and window identity — change if the exe name differs
ProcessName = DeltaForce.exe
WindowClass = UnrealWindow
WindowTitle = Delta Force
ModuleName  = DeltaForce.exe

[UE5 Core]
# Module-level offsets from game base address
# Find via pattern scan or SDK dump (GObjects, GNames, GWorld are global pointers)
GWorld   = 0x0
GNames   = 0x0
GObjects = 0x0

[UWorld]
OwningGameInstance = 0x1B8
PersistentLevel    = 0x30
GameState           = 0x158

[GameInstance]
LocalPlayers = 0x38

[LocalPlayer]
PlayerController = 0x30

[PlayerController]
AcknowledgedPawn    = 0x338
PlayerCameraManager = 0x348

[ULevel]
Actors     = 0x98
ActorCount = 0xA0

[AActor]
RootComponent = 0x190
ActorMesh     = 0x310
bHidden       = 0x58

[USceneComponent]
RelativeLocation = 0x128
ComponentToWorld = 0x1C0

[APlayerState]
PlayerNamePrivate = 0x310
TeamIndex         = 0x10C

[Character]
# These are game-specific — find via SDK dump or ReClass
Health    = 0x0
MaxHealth = 0x0
Shield    = 0x0
MaxShield = 0x0
bIsDead   = 0x0

[SkeletalMesh]
BoneArray              = 0x5B0
BoneSpaceTransforms    = 0x5B0
ComponentToWorldMatrix = 0x1C0

[Camera]
# APlayerCameraManager offsets
CameraLocation = 0x0
CameraRotation = 0x0
CameraFOV      = 0x0

[Recoil]
# Pawn recoil offsets (game-specific)
RecoilPitch  = 0x0
RecoilYaw    = 0x0
AimPunchAngle = 0x0
