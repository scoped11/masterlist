# Project Zomboid JVM / client offsets — NOT populated in repo (see external/pz/README.md)
# Populate using a local tools/dumper2.cpp JVM class walk on YOUR build (Build 41/42).
#
# research/LINKS.md "ZDMA" entries are DMA FPGA firmware vendors — NOT PZ game offsets.

[process]
ExeName=ProjectZomboid64.exe
JvmModule=jvm.dll

[offsets]
# Absolute VA or module-relative — your choice once validated on Windows
OnlinePlayersStatic=0
IsoPlayer_x=0
IsoPlayer_y=0
IsoPlayer_z=0
IsoPlayer_username=0

[notes]
# IsoPlayer list is typically via LuaManager / ArrayList<IsoPlayer> on JVM heap — requires
# version-specific field offsets from dumper output, not a single static pointer in most builds.