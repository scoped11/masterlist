# Rainbow Six Siege DMA Cheat — Offset Config
# Engine: AnvilNext 2.0 (Ubisoft custom), BattlEye AC
# Note: Run dumper against current build for offsets.
#
# Build: cl /O2 /EHsc /D_CRT_SECURE_NO_WARNINGS r6_dma.cpp gdi32.lib user32.lib winmm.lib ws2_32.lib /link /SUBSYSTEM:WINDOWS
# Usage: r6_dma.exe --offsets=r6_offsets.ini
#        r6_dma.exe --noscan   (skip sig scanning, use manual offsets only)

[Identity]
GameName=Rainbow Six Siege
ProcessName=RainbowSix.exe
ModuleName=RainbowSix.exe
Engine=anvilnext
UnitScale=1

[Encryption]
# AnvilNext 2.0 encrypted pointer config (version-dependent)
# XOR key and bit rotation applied to entity pointers.
# Set to 0 to disable decryption (if game version doesn't encrypt).
DecryptKey=0x0
DecryptRotation=0

[Patterns]
# Sig scanning patterns — scans .text section via DMA for RIP-relative LEA refs.
# Format: <Name>_Bytes = hex bytes with ?? wildcards
#         <Name>_RipOffset = byte offset to the RIP-relative displacement (default 3)
# Results are stored as offsets under the pattern name.
#
# Example for GameManager:
#   GameManager_Bytes=48 8D 0D ?? ?? ?? ?? 48 89 4C 24
#   GameManager_RipOffset=3
#
# Add patterns for each manager singleton once reversed from current build:
; GameManager_Bytes=48 8D 0D ?? ?? ?? ?? 48 89 4C 24
; GameManager_RipOffset=3
; CameraManager_Bytes=48 8B 05 ?? ?? ?? ?? 48 85 C0 74 ?? F3 0F 10
; CameraManager_RipOffset=3
; StatusManager_Bytes=48 8D 15 ?? ?? ?? ?? E8 ?? ?? ?? ?? 48 8B F0
; StatusManager_RipOffset=3
; GlowManager_Bytes=48 8B 0D ?? ?? ?? ?? E8 ?? ?? ?? ?? 84 C0 74 ?? 48 8D
; GlowManager_RipOffset=3
; PlayerManager_Bytes=48 8B 05 ?? ?? ?? ?? 48 85 C0 74 ?? 48 8B 48
; PlayerManager_RipOffset=3
; RoundManager_Bytes=48 8B 0D ?? ?? ?? ?? 48 85 C9 74 ?? E8 ?? ?? ?? ?? 84 C0
; RoundManager_RipOffset=3

