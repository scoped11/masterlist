# Rust DMA Radar — Offset Config
# Engine: Unity (Facepunch), EAC
# Module: GameAssembly.dll (IL2CPP compiled)
# Run dumper_dma.exe on target to find current offsets

[Identity]
GameName=Rust
ProcessName=RustClient.exe
ModuleName=GameAssembly.dll
Engine=unity
UnitScale=1

[Core]
# Unity IL2CPP: BaseNetworkable.clientEntities -> ListDictionary -> vals -> buffer[]
# GWorld = BaseNetworkable::clientEntities (static field in GameAssembly.dll)
GWorld=0x0

[Level]
# Actors = entityList buffer pointer
# ActorCount = entityList count
Actors=0x10
ActorCount=0x18

[Actor]
RootComponent=0x28
RelativeLocation=0x90
Pawn_Position=0x90
Pawn_Health=0xE4
Pawn_Team=0x0

[Player]
# BasePlayer offsets
TeamIndex=0x0
Health=0xE4
MaxHealth=0xE8
bIsDead=0x0
PlayerNamePrivate=0x640

[Camera]
CameraLocation=0x0
CameraRotation=0x0
CameraFOV=0x0
