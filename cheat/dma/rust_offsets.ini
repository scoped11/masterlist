# Rust DMA Radar — Offset Config
# Engine: Unity (IL2CPP), EAC
# Module: GameAssembly.dll
# Note: Run dumper_dma.exe --offsets against a running Rust client
#       to auto-resolve these from IL2CPP runtime metadata.
#       The DMA cheat auto-fetches this file from GitHub on startup.

[Identity]
GameName=Rust
ProcessName=RustClient.exe
ModuleName=GameAssembly.dll
Engine=unity
UnitScale=1

# =============================================================================
# Static pointers (GameAssembly.dll + offset)
# These come from il2cpp static field RVAs — must be dumped per-build.
# =============================================================================

[Core]
# BaseNetworkable.clientEntities (static EntityRealm)
ClientEntities=0x0
# LocalPlayer.Entity (static BasePlayer ref)
LocalPlayer=0x0
# MainCamera (UnityPlayer.dll static — optional, for W2S)
MainCamera=0x0

# =============================================================================
# Entity chain: clientEntities → EntityRealm → ListDictionary → BufferList → array
# These are struct-layout offsets, stable across Rust builds unless Unity upgrades.
# =============================================================================

[EntityChain]
# EntityRealm.entityList (ListDictionary<NetworkableId, BaseNetworkable>)
ER_EntityList=0x28
# ListDictionary.vals (BufferList<BaseNetworkable>)
LD_Vals=0x20
# ListDictionary.count (int)
LD_Count=0x18
# BufferList<T>.buffer (T[] managed array pointer)
BL_Buffer=0x10
# BufferList<T>.size (int — actual count, not array capacity)
BL_Size=0x18

# =============================================================================
# IL2CPP object layout (stable across IL2CPP versions 24-31)
# =============================================================================

[Il2Cpp]
# Il2CppObject.klass (Il2CppClass*)
Obj_Klass=0x00
# Il2CppClass.name (const char*)
Klass_Name=0x10
# Il2CppClass.namespaze (const char*)
Klass_Namespace=0x18
# Il2CppClass.parent (Il2CppClass*)
Klass_Parent=0x30

# =============================================================================
# BaseNetworkable (base class for all networked entities)
# =============================================================================

[BaseNetworkable]
# uint prefabID
BN_PrefabID=0x18
# Networkable net
BN_Net=0x58

# =============================================================================
# BaseEntity : BaseNetworkable
# =============================================================================

[BaseEntity]
# Model model (PlayerModel component)
BE_Model=0x0
# BaseEntity.Flags flags (enum)
BE_Flags=0x0
# cached ObjRef<Transform>
BE_Transform=0x10

# =============================================================================
# BaseCombatEntity : BaseEntity
# =============================================================================

[BaseCombatEntity]
# float _health
BCE_Health=0x0
# float _maxHealth
BCE_MaxHealth=0x0

# =============================================================================
# BasePlayer : BaseCombatEntity
# Chain: BaseNetworkable → BaseEntity → BaseCombatEntity → BasePlayer
# =============================================================================

[BasePlayer]
# string _displayName
BP_DisplayName=0x0
# PlayerFlags playerFlags (1=Admin, 2=Moderator, 4=Sleeping, 8=Spectating,
#   16=Wounded, 32=Developer, 64=Connected, 128=ThirdPerson, etc.)
BP_PlayerFlags=0x0
# PlayerModel playerModel
BP_PlayerModel=0x0
# PlayerEyes eyes
BP_Eyes=0x0
# PlayerInventory inventory
BP_Inventory=0x0
# ulong userID (SteamID)
BP_UserID=0x0
# ulong currentTeam
BP_Team=0x0
# ModelState modelState
BP_ModelState=0x0
# PlayerMetabolism metabolism
BP_Metabolism=0x0
# uint clActiveItem
BP_ActiveItem=0x0
# BaseMovement movement
BP_Movement=0x0
# InputState input
BP_Input=0x0
# BaseMountable mounted
BP_MountEntity=0x0
# ulong SteamID (may alias userID)
BP_SteamID=0x0
# ulong clientTeam (alt team field)
BP_ClientTeam=0x0

# =============================================================================
# PlayerModel — holds position/rotation (client-interpolated)
# =============================================================================

[PlayerModel]
# Vector3 newPosition (client-side interpolated position)
PM_Position=0x0
# Quaternion rotation
PM_Rotation=0x0

# =============================================================================
# ModelState — holds client-predicted position and movement flags
# =============================================================================

[ModelState]
# int flags (1=Ducked, 2=Jumped, 4=OnGround, 8=Sleeping, 16=Sprinting,
#   32=OnLadder, 64=Flying, 128=Aiming, 256=Prone, 512=Mounted, 1024=Relaxed)
MS_Flags=0x0
# Vector3 position (client-predicted)
MS_Position=0x0

# =============================================================================
# PlayerEyes — look direction and head position
# =============================================================================

[PlayerEyes]
# Quaternion bodyRotation (look direction)
PE_BodyRotation=0x0
# Vector3 viewOffset (head offset from feet)
PE_ViewOffset=0x0
# head lean offset
PE_HeadAngles=0x0

# =============================================================================
# PlayerMetabolism — survival stats
# =============================================================================

[PlayerMetabolism]
PM_Health=0x0
PM_Hydration=0x0
PM_Calories=0x0
PM_Comfort=0x0
PM_Radiation=0x0
PM_Bleeding=0x0

# =============================================================================
# Camera (UnityPlayer.dll — optional for world-to-screen projection)
# =============================================================================

[Camera]
Cam_ViewMatrix=0x0
Cam_FOV=0x0
