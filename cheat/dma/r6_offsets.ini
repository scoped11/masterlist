# Rainbow Six Siege DMA Radar — Offset Config
# Engine: AnvilNext 2.0 (Ubisoft proprietary), BattlEye AC
# Note: Run dma_main.exe --offsets with R6 running to auto-scan.
# Static pointer RVAs change every patch — re-run after game updates.
# Structure offsets are more stable but may shift on major updates.

[Identity]
GameName=Rainbow Six Siege
ProcessName=RainbowSix.exe
ProcessName_BE=RainbowSix_BE.exe
ModuleName=RainbowSix.exe
Engine=anvilnext2
UnitScale=1

# Static pointer RVAs (relative to RainbowSix.exe base)
# These MUST be updated via --offsets scan each patch.
# Set to 0x0 = not yet scanned for this build.
[Managers]
GameManager=0x0
StatusManager=0x0
CameraManager=0x0
ProfileManager=0x0
NetworkManager=0x0
GlowManager=0x0

# GameManager structure offsets
[GameManager]
EntityList=0x1C8
EntityCount=0x1D0

# Entity structure offsets
[Entity]
EntityPawn=0x20
EntityReplication=0xC8
EntityComponentChain=0xD8
HeadPosition=0x6A0
FeetPosition=0x700

# Replication structure offsets
[Replication]
TeamID=0x190

# Component chain: Entity+0xD8 -> +0x8 -> +0x168
[Component]
ChildComponent=0x8
Health=0x168

# StatusManager: local player identification
[StatusManager]
LocalEntity=0x28

# Camera pointer chain: [CameraManager]+0x120 -> +0x1C8 -> +0x08 = Camera
[CameraChain]
EngineLink=0x120
Engine=0x1C8
CameraObject=0x08

# Camera structure offsets (within camera object)
[Camera]
ViewRight=0xD0
ViewUp=0xE0
ViewForward=0xF0
ViewTranslation=0x100
FovX=0x110
FovY=0x124

# Glow (if GlowManager found)
[Glow]
GlowEnable=0x0
GlowThroughWalls=0x0
GlowColor=0x0

# Combat (weapon/recoil — requires further RE)
[Combat]
ControlRotation=0x0
RecoilPitch=0x0
RecoilYaw=0x0

# NOTE: GameManager pointer may be encrypted with XOR + ROL/ROR.
# Decryption keys change each patch and must be found via sig scan.
# The --offsets dumper attempts automatic decryption validation.
