# Escape From Tarkov DMA Radar — Offset Config
# Engine: Unity, BattlEye AC
# Module: UnityPlayer.dll + EscapeFromTarkov.exe
# Run dumper_dma.exe on target to find current offsets

[Identity]
GameName=Escape From Tarkov
ProcessName=EscapeFromTarkov.exe
ModuleName=UnityPlayer.dll
Engine=unity
UnitScale=1

[Core]
# Unity: GameWorld -> RegisteredPlayers list -> Player objects
# GWorld = pointer to GameWorld singleton
GWorld=0x0

[Level]
# RegisteredPlayers list
Actors=0x80
ActorCount=0x88

[Actor]
RootComponent=0x28
RelativeLocation=0xB0
Pawn_Position=0xB0
Pawn_Health=0x0
Pawn_Team=0x0

[Player]
# Player.Profile.Info.Side (USEC/BEAR/Scav)
TeamIndex=0x0
# HealthController -> bodyPartHealth
Health=0x0
MaxHealth=0x0
bIsDead=0x0
PlayerNamePrivate=0x0

[Camera]
CameraLocation=0x0
CameraRotation=0x0
CameraFOV=0x0
