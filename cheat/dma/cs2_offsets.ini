# Counter-Strike 2 DMA Radar — Offset Config
# Engine: Source 2, VAC
# Module: client.dll
# Run dumper_dma.exe on target to find current offsets

[Identity]
GameName=Counter-Strike 2
ProcessName=cs2.exe
ModuleName=client.dll
Engine=entitylist
UnitScale=1

[Core]
# Source 2: EntitySystem -> EntityList -> CCSPlayerController -> CSPlayerPawn
# EntityList is a sparse index: list[handle >> 9][handle & 0x1FF]
EntityList=0x0
GWorld=0x0

[EntityList]
EntityListEntry=0x78
EntityListStride=0x8

[Controller]
# CCSPlayerController -> m_hPlayerPawn
AcknowledgedPawn=0x7FC
PlayerController=0x30

[Pawn]
# CSPlayerPawn offsets
Pawn_Position=0x1274
Pawn_Health=0x344
Pawn_Team=0x3CB

[Camera]
# View angles from local player
CameraLocation=0x0
CameraRotation=0x0
CameraFOV=0x0
